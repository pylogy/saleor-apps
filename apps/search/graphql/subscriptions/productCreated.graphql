subscription ProductCreated {
  event {
    __typename
    ... on ProductCreated {
      __typename
      product_tg1: product(channel: "tg1-channel") {
        ...ProductWebhookPayload
      }
      product_tg2: product(channel: "tg2-channel") {
        ...ProductWebhookPayload
      }
    }
    recipient {
      webhooks {
        id
      }
    }
  }
}
